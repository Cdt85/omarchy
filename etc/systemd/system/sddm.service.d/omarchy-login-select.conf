# Decide at every SDDM start, not once at boot, whose desktop it opens: with
# more than one account the unlock picks it once, and a restarted SDDM shows
# the login screen. The leading - keeps SDDM starting if the choice fails,
# which removes the autologin before anything else.
[Service]
ExecStartPre=-/usr/bin/omarchy-login-select
